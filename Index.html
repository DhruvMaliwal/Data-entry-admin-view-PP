<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Data Entry Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .main-card { max-width: 800px; margin: 2rem auto; }
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 9999;
      justify-content: center; align-items: center;
    }
    #overlay.active { display: flex; }
    .spinner-box {
      background: #fff; border-radius: 12px; padding: 2rem 3rem;
      text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    /* Step indicators */
    .step { display: none; }
    .step.active { display: block; }
    /* Dashboard table */
    .dashboard-table { font-size: 0.9rem; }
    .dashboard-table th { background: #f0f0f0; position: sticky; top: 0; }
    .table-scroll { max-height: 400px; overflow-y: auto; }
    .house-card {
      cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .house-card:hover, .house-card.selected {
      border-color: #0d6efd; box-shadow: 0 0 0 2px rgba(13,110,253,0.25);
    }
    .stat-card { text-align: center; padding: 1rem; }
    .stat-card .stat-value { font-size: 1.8rem; font-weight: 700; color: #0d6efd; }
    .stat-card .stat-label { font-size: 0.85rem; color: #6c757d; }
  </style>
</head>
<body>

<!-- Spinner overlay -->
<div id="overlay">
  <div class="spinner-box">
    <div class="spinner-border text-primary mb-3" role="status" style="width:3rem;height:3rem;">
      <span class="visually-hidden">Processing…</span>
    </div>
    <p class="mb-0 fw-semibold" id="overlayText">Loading…</p>
  </div>
</div>

<div class="main-card">

  <!-- ====================================================================
       STEP 1: Select a Household
       ==================================================================== -->
  <div id="step1" class="step active">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title mb-1">Property Data Entry Portal</h3>
        <p class="text-muted mb-4">Select a household to upload data for, or create a new one.</p>

        <div id="householdList" class="mb-3">
          <!-- Populated dynamically -->
        </div>

        <div id="noHouseholds" class="text-center text-muted py-4" style="display:none;">
          <p class="mb-2">No households yet. Create one to get started.</p>
        </div>

        <hr>

        <!-- Add new household form -->
        <div class="mt-3">
          <h6 class="fw-semibold mb-3">Add New Household</h6>
          <div class="row g-2">
            <div class="col-md-3">
              <input type="text" class="form-control" id="newHouseId" placeholder="House ID (e.g. H101)">
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control" id="newHouseName" placeholder="House Name">
            </div>
            <div class="col-md-3">
              <input type="text" class="form-control" id="newHouseAddr" placeholder="Address">
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-primary w-100" onclick="addNewHousehold()">Add</button>
            </div>
          </div>
          <div id="addHouseMsg" class="mt-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====================================================================
       STEP 2: Upload Data File for Selected Household
       ==================================================================== -->
  <div id="step2" class="step">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <button class="btn btn-sm btn-outline-secondary mb-3" onclick="goToStep(1)">&larr; Back to Households</button>

        <h4 class="card-title mb-1">Upload Data Entry</h4>
        <p class="text-muted mb-3">
          Uploading for: <strong id="selectedHouseLabel"></strong>
        </p>

        <div class="mb-3">
          <label for="dataFile" class="form-label fw-semibold">Data File (.xlsx or .csv)</label>
          <input class="form-control" type="file" id="dataFile" accept=".xlsx,.xls,.csv" required>
          <div class="form-text">Upload the data entry spreadsheet for this household.</div>
        </div>

        <button class="btn btn-primary w-100" id="uploadBtn" onclick="submitDataEntry()">
          Upload &amp; Process
        </button>

        <div id="uploadMsg" class="mt-3"></div>
      </div>
    </div>
  </div>

  <!-- ====================================================================
       STEP 3: Dashboard — shows parsed data after upload
       ==================================================================== -->
  <div id="step3" class="step">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h4 class="card-title mb-0">Data Entry Dashboard</h4>
            <p class="text-muted mb-0">
              <span id="dashHouseId"></span> &middot; <span id="dashDate"></span>
            </p>
          </div>
          <div>
            <button class="btn btn-sm btn-outline-primary me-2" onclick="goToStep(2)">Upload More</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="goToStep(1)">All Households</button>
          </div>
        </div>

        <!-- Summary stats -->
        <div class="row g-3 mb-4" id="statsRow"></div>

        <!-- Data table -->
        <div class="table-scroll">
          <table class="table table-bordered table-striped dashboard-table mb-0">
            <thead id="dashHeaders"></thead>
            <tbody id="dashBody"></tbody>
          </table>
        </div>

        <div id="dashMsg" class="mt-3"></div>
      </div>
    </div>
  </div>

</div>

<script>
  var selectedHouseId = null;
  var selectedHouseName = '';

  // -----------------------------------------------------------------------
  // On page load, fetch the household list
  // -----------------------------------------------------------------------
  window.addEventListener('DOMContentLoaded', function() {
    loadHouseholds();
  });

  // -----------------------------------------------------------------------
  // Step navigation
  // -----------------------------------------------------------------------
  function goToStep(n) {
    document.querySelectorAll('.step').forEach(function(el) { el.classList.remove('active'); });
    document.getElementById('step' + n).classList.add('active');
    if (n === 1) loadHouseholds();
  }

  // -----------------------------------------------------------------------
  // Load households from the backend and render as selectable cards
  // -----------------------------------------------------------------------
  function loadHouseholds() {
    showOverlay(true, 'Loading households…');
    google.script.run
      .withSuccessHandler(function(list) {
        showOverlay(false);
        var container = document.getElementById('householdList');
        var noMsg = document.getElementById('noHouseholds');

        if (!list || list.length === 0) {
          container.innerHTML = '';
          noMsg.style.display = 'block';
          return;
        }
        noMsg.style.display = 'none';

        var html = '<div class="row g-2">';
        list.forEach(function(h) {
          html += '<div class="col-md-6">' +
            '<div class="card house-card p-3" onclick="selectHousehold(\'' +
            escapeAttr(h.id) + '\',\'' + escapeAttr(h.name) + '\')">' +
            '<div class="fw-semibold">' + escapeHtml(h.id) + ' — ' + escapeHtml(h.name) + '</div>' +
            '<small class="text-muted">' + escapeHtml(h.address || 'No address') + '</small>' +
            '</div></div>';
        });
        html += '</div>';
        container.innerHTML = html;
      })
      .withFailureHandler(function(err) {
        showOverlay(false);
        document.getElementById('householdList').innerHTML =
          '<div class="alert alert-danger">Failed to load: ' + escapeHtml(err.message) + '</div>';
      })
      .getHouseholds();
  }

  // -----------------------------------------------------------------------
  // Select a household and move to Step 2
  // -----------------------------------------------------------------------
  function selectHousehold(id, name) {
    selectedHouseId = id;
    selectedHouseName = name;
    document.getElementById('selectedHouseLabel').textContent = id + ' — ' + name;
    document.getElementById('dataFile').value = '';
    document.getElementById('uploadMsg').innerHTML = '';
    goToStep(2);
  }

  // -----------------------------------------------------------------------
  // Add a new household
  // -----------------------------------------------------------------------
  function addNewHousehold() {
    var id = document.getElementById('newHouseId').value.trim();
    var name = document.getElementById('newHouseName').value.trim();
    var addr = document.getElementById('newHouseAddr').value.trim();
    var msgEl = document.getElementById('addHouseMsg');

    if (!id || !name) {
      msgEl.innerHTML = '<div class="alert alert-warning py-2">House ID and Name are required.</div>';
      return;
    }

    showOverlay(true, 'Adding household…');
    google.script.run
      .withSuccessHandler(function(result) {
        showOverlay(false);
        if (result.success) {
          msgEl.innerHTML = '<div class="alert alert-success py-2">' + escapeHtml(result.message) + '</div>';
          document.getElementById('newHouseId').value = '';
          document.getElementById('newHouseName').value = '';
          document.getElementById('newHouseAddr').value = '';
          loadHouseholds();
        } else {
          msgEl.innerHTML = '<div class="alert alert-danger py-2">' + escapeHtml(result.message) + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        showOverlay(false);
        msgEl.innerHTML = '<div class="alert alert-danger py-2">' + escapeHtml(err.message) + '</div>';
      })
      .addHousehold(id, name, addr);
  }

  // -----------------------------------------------------------------------
  // Submit the data entry file
  // -----------------------------------------------------------------------
  function submitDataEntry() {
    var fileInput = document.getElementById('dataFile');
    if (!fileInput.files.length) {
      document.getElementById('uploadMsg').innerHTML =
        '<div class="alert alert-warning">Please select a file.</div>';
      return;
    }

    showOverlay(true, 'Processing data file…');

    readFileAsBase64(fileInput.files[0]).then(function(dataFileObj) {
      google.script.run
        .withSuccessHandler(onUploadSuccess)
        .withFailureHandler(onUploadFailure)
        .processDataEntry(selectedHouseId, dataFileObj);
    }).catch(function(err) {
      showOverlay(false);
      document.getElementById('uploadMsg').innerHTML =
        '<div class="alert alert-danger">Failed to read file: ' + escapeHtml(err.message) + '</div>';
    });
  }

  // -----------------------------------------------------------------------
  // After successful upload, show the dashboard
  // -----------------------------------------------------------------------
  function onUploadSuccess(result) {
    showOverlay(false);
    if (!result.success) {
      document.getElementById('uploadMsg').innerHTML =
        '<div class="alert alert-danger">' + escapeHtml(result.message) + '</div>';
      return;
    }

    // Populate dashboard
    document.getElementById('dashHouseId').textContent = result.houseId;
    document.getElementById('dashDate').textContent = result.uploadDate;

    var headers = result.headers;
    var data = result.data;

    // Stats row — total rows + summary of numeric columns
    var statsHtml = '<div class="col-sm-3"><div class="stat-card card"><div class="stat-value">' +
      data.length + '</div><div class="stat-label">Rows Uploaded</div></div></div>';

    // Detect numeric columns and show sums
    var numericCols = [];
    headers.forEach(function(h) {
      var allNumeric = true;
      var sum = 0;
      for (var i = 0; i < data.length; i++) {
        var v = parseFloat(String(data[i][h]).replace(/[,$]/g, ''));
        if (isNaN(v)) { allNumeric = false; break; }
        sum += v;
      }
      if (allNumeric && data.length > 0) {
        numericCols.push({ header: h, sum: sum });
      }
    });

    numericCols.slice(0, 3).forEach(function(col) {
      var displayVal = col.sum % 1 === 0 ? col.sum.toLocaleString() : col.sum.toLocaleString(undefined, {maximumFractionDigits: 2});
      statsHtml += '<div class="col-sm-3"><div class="stat-card card">' +
        '<div class="stat-value">' + displayVal + '</div>' +
        '<div class="stat-label">Total ' + escapeHtml(col.header) + '</div></div></div>';
    });

    document.getElementById('statsRow').innerHTML = statsHtml;

    // Table headers
    var thHtml = '<tr>';
    thHtml += '<th>#</th>';
    headers.forEach(function(h) { thHtml += '<th>' + escapeHtml(h) + '</th>'; });
    thHtml += '</tr>';
    document.getElementById('dashHeaders').innerHTML = thHtml;

    // Table body
    var tbHtml = '';
    data.forEach(function(row, idx) {
      tbHtml += '<tr><td>' + (idx + 1) + '</td>';
      headers.forEach(function(h) {
        tbHtml += '<td>' + escapeHtml(String(row[h] || '')) + '</td>';
      });
      tbHtml += '</tr>';
    });
    document.getElementById('dashBody').innerHTML = tbHtml;

    document.getElementById('dashMsg').innerHTML =
      '<div class="alert alert-success">' + escapeHtml(result.message) + '</div>';

    goToStep(3);
  }

  function onUploadFailure(err) {
    showOverlay(false);
    document.getElementById('uploadMsg').innerHTML =
      '<div class="alert alert-danger">Server error: ' + escapeHtml(err.message) + '</div>';
  }

  // -----------------------------------------------------------------------
  // Utility functions
  // -----------------------------------------------------------------------
  function readFileAsBase64(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() {
        var base64 = reader.result.split(',')[1];
        resolve({ name: file.name, mimeType: file.type, base64: base64 });
      };
      reader.onerror = function() { reject(reader.error); };
      reader.readAsDataURL(file);
    });
  }

  function showOverlay(on, text) {
    if (text) document.getElementById('overlayText').textContent = text;
    document.getElementById('overlay').classList.toggle('active', on);
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s));
    return div.innerHTML;
  }

  function escapeAttr(s) {
    return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
