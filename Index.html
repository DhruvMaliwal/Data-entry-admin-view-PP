<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Data Entry Portal</title>

  <!-- Bootstrap 5 for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    /* Spinner overlay covers the entire page during processing */
    #overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
      justify-content: center; align-items: center;
    }
    #overlay.active { display: flex; }
    .spinner-box {
      background: #fff; border-radius: 12px; padding: 2rem 3rem;
      text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    body { background: #f5f6fa; }
    .card { max-width: 640px; margin: 3rem auto; }
  </style>
</head>
<body>

<!-- ======================================================================
     Spinner overlay — shown while the backend is processing
     ====================================================================== -->
<div id="overlay">
  <div class="spinner-box">
    <div class="spinner-border text-primary mb-3" role="status" style="width:3rem;height:3rem;">
      <span class="visually-hidden">Processing…</span>
    </div>
    <p class="mb-0 fw-semibold">Processing files… please wait.</p>
  </div>
</div>

<!-- ======================================================================
     Main form card
     ====================================================================== -->
<div class="card shadow-sm">
  <div class="card-body p-4">
    <h3 class="card-title mb-1">Property Data Entry</h3>
    <p class="text-muted mb-4">Upload a data file and property images to populate the master sheet.</p>

    <form id="entryForm">
      <!-- Data file input — single file, Excel or CSV -->
      <div class="mb-3">
        <label for="dataFile" class="form-label fw-semibold">Data File (.xlsx or .csv)</label>
        <input class="form-control" type="file" id="dataFile"
               accept=".xlsx,.xls,.csv" required>
        <div class="form-text">One file with columns: House ID, Address, Price, Beds, Baths, Description.</div>
      </div>

      <!-- Image file input — multiple images -->
      <div class="mb-3">
        <label for="imageFiles" class="form-label fw-semibold">Property Images</label>
        <input class="form-control" type="file" id="imageFiles"
               accept="image/*" multiple>
        <div class="form-text">Filenames must start with the House ID, e.g. <code>H101_front.jpg</code>.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100" id="submitBtn">Submit</button>
    </form>

    <!-- Result area — hidden until submission completes -->
    <div id="resultArea" class="mt-4" style="display:none;"></div>
  </div>
</div>

<!-- ======================================================================
     Client-side logic
     ====================================================================== -->
<script>
  // Prevent double-submission
  var submitting = false;

  document.getElementById('entryForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (submitting) return;
    submitting = true;

    var dataInput   = document.getElementById('dataFile');
    var imageInput  = document.getElementById('imageFiles');
    var resultArea  = document.getElementById('resultArea');
    resultArea.style.display = 'none';

    if (!dataInput.files.length) {
      showResult(false, 'Please select a data file.');
      submitting = false;
      return;
    }

    showOverlay(true);

    // -----------------------------------------------------------------------
    // readFileAsBase64 — converts a File object to a plain object with
    // name, mimeType, and base64-encoded content (Apps Script can't receive
    // File objects directly, so we serialise everything client-side).
    // -----------------------------------------------------------------------
    function readFileAsBase64(file) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() {
          // result is "data:<mime>;base64,<data>" — strip the prefix
          var base64 = reader.result.split(',')[1];
          resolve({ name: file.name, mimeType: file.type, base64: base64 });
        };
        reader.onerror = function() { reject(reader.error); };
        reader.readAsDataURL(file);
      });
    }

    // -----------------------------------------------------------------------
    // Read all selected files, then call the backend
    // -----------------------------------------------------------------------
    var promises = [];
    promises.push(readFileAsBase64(dataInput.files[0]));

    var imgFiles = imageInput.files;
    for (var i = 0; i < imgFiles.length; i++) {
      promises.push(readFileAsBase64(imgFiles[i]));
    }

    Promise.all(promises).then(function(results) {
      var dataFileObj   = results[0];
      var imageFileObjs = results.slice(1);

      // google.script.run sends the data to Code.gs → processSubmission
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .processSubmission(dataFileObj, imageFileObjs);
    }).catch(function(err) {
      showOverlay(false);
      showResult(false, 'Failed to read files: ' + err.message);
      submitting = false;
    });
  });

  // -----------------------------------------------------------------------
  // onSuccess — called when processSubmission returns without throwing
  // -----------------------------------------------------------------------
  function onSuccess(result) {
    showOverlay(false);
    submitting = false;

    if (result.success) {
      var html = '<div class="alert alert-success">' + escapeHtml(result.message) + '</div>';
      if (result.warnings && result.warnings.length) {
        html += '<div class="alert alert-warning"><strong>Warnings:</strong><ul>';
        result.warnings.forEach(function(w) {
          html += '<li>' + escapeHtml(w) + '</li>';
        });
        html += '</ul></div>';
      }
      showResultHtml(html);
      document.getElementById('entryForm').reset();
    } else {
      showResult(false, result.message);
    }
  }

  // -----------------------------------------------------------------------
  // onFailure — called when processSubmission throws an unhandled error
  // -----------------------------------------------------------------------
  function onFailure(err) {
    showOverlay(false);
    submitting = false;
    showResult(false, 'Server error: ' + err.message);
  }

  // -----------------------------------------------------------------------
  // UI helpers
  // -----------------------------------------------------------------------
  function showOverlay(on) {
    document.getElementById('overlay').classList.toggle('active', on);
  }
  function showResult(success, text) {
    var cls = success ? 'alert-success' : 'alert-danger';
    showResultHtml('<div class="alert ' + cls + '">' + escapeHtml(text) + '</div>');
  }
  function showResultHtml(html) {
    var el = document.getElementById('resultArea');
    el.innerHTML = html;
    el.style.display = 'block';
  }
  function escapeHtml(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s));
    return div.innerHTML;
  }
</script>

</body>
</html>
